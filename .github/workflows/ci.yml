name: Python Playwright Scraper CI

# Uncomment to enable daily runs at 8:00 AM UTC
# on:
#   schedule:
#     - cron: '0 8 * * *'
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which scraper to run?'
        type: choice
        options:
          - all
          - I3harris
          - Boeing
          - General Dynamics
        default: all
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Run I3harris scraper
        if: ${{ inputs.target == 'I3harris' || inputs.target == 'all' }}
        run: python I3harris/scrape_l3harris_jobs.py

      - name: Run Boeing scraper
        if: ${{ inputs.target == 'Boeing' || inputs.target == 'all' }}
        run: python Boeing/scrape_boeing_jobs.py

      - name: Run General Dynamics scraper
        if: ${{ inputs.target == 'General Dynamics' || inputs.target == 'all' }}
        run: python GeneralDynamics/scrape_general_dynamics_jobs.py

      - name: Upload I3harris results
        if: ${{ inputs.target == 'I3harris' || inputs.target == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: l3harris-jobs
          path: I3harris/l3harris_jobs.xlsx

      - name: Upload Boeing results
        if: ${{ inputs.target == 'Boeing' || inputs.target == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: Boeing
          path: Boeing/boeing_jobs.xlsx

      - name: Upload General Dynamics results
        if: ${{ inputs.target == 'General Dynamics' || inputs.target == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: General Dynamics
          path: GeneralDynamics/general_dynamics_jobs.xlsx

name: Python Playwright Scraper CI

# Schedule: Uncomment to run every day at 08:00 UTC
# on:
#   schedule:
#     - cron: '0 8 * * *'

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Run scraper
        run: |
          python l3harris/scrape_l3harris_jobs.py

      - name: Upload Excel results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l3harris-jobs-excel
          path: MultiSiteJobScraper\I3harris\l3harris_jobs.xlsx
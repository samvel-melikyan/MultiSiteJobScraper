name: Job Scraper CI

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which scraper to run?'
        type: choice
        options:
          - all
          - I3harris
          - Boeing
          - General Dynamics
        default: all
      start_page:
        description: 'Start page number (for chunked scraping)'
        required: false
        default: '1'
      end_page:
        description: 'End page number (use "max" to scrape to the end)'
        required: false
        default: 'max'

  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Run I3harris scraper
        if: ${{ inputs.target == 'I3harris' || inputs.target == 'all' }}
        run: |
          python I3harris/scrape_l3harris_jobs.py --start ${START_PAGE} --end ${END_PAGE} --output I3harris/l3harris_jobs_${{ inputs.start_page }}_${{ inputs.end_page }}.xlsx
        env:
          START_PAGE: ${{ inputs.start_page }}
          END_PAGE: ${{ inputs.end_page }}

      - name: Run Boeing scraper
        if: ${{ inputs.target == 'Boeing' || inputs.target == 'all' }}
        run: |
          python Boeing/scrape_boeing_jobs.py --start ${START_PAGE} --end ${END_PAGE} --output Boeing/boeing_jobs_${{ inputs.start_page }}_${{ inputs.end_page }}.xlsx
        env:
          START_PAGE: ${{ inputs.start_page }}
          END_PAGE: ${{ inputs.end_page }}

      - name: Run General Dynamics scraper
        if: ${{ inputs.target == 'General Dynamics' || inputs.target == 'all' }}
        run: |
          python GeneralDynamics/scrape_general_dynamics_jobs.py --start ${START_PAGE} --end ${END_PAGE} --output GeneralDynamics/general_dynamics_jobs_${{ inputs.start_page }}_${{ inputs.end_page }}.xlsx
        env:
          START_PAGE: ${{ inputs.start_page }}
          END_PAGE: ${{ inputs.end_page }}

      - name: Upload I3harris results
        if: ${{ inputs.target == 'I3harris' || inputs.target == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: l3harris-jobs-${{ inputs.start_page }}-${{ inputs.end_page }}
          path: I3harris/l3harris_jobs_${{ inputs.start_page }}_${{ inputs.end_page }}.xlsx

      - name: Upload Boeing results
        if: ${{ inputs.target == 'Boeing' || inputs.target == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: boeing-jobs-${{ inputs.start_page }}-${{ inputs.end_page }}
          path: Boeing/boeing_jobs_${{ inputs.start_page }}_${{ inputs.end_page }}.xlsx

      - name: Upload General Dynamics results
        if: ${{ inputs.target == 'General Dynamics' || inputs.target == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: general-dynamics-jobs-${{ inputs.start_page }}-${{ inputs.end_page }}
          path: GeneralDynamics/general_dynamics_jobs_${{ inputs.start_page }}_${{ inputs.end_page }}.xlsx
